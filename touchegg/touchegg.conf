<?xml version="1.0" encoding="UTF-8"?>
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">89B4FA</property>
    <property name="borderColor">89B4FA</property>
  </settings>

  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>/usr/bin/i3-msg -q 'workspace next_on_output'</command>
        <on>end</on>
        <animate>false</animate>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>/usr/bin/i3-msg -q 'workspace prev_on_output'</command>
        <on>end</on>
        <animate>false</animate>
      </action>
    </gesture>
  </application>
</touchégg>
